<ion-content>
  <div class="background m-0 p-0 h-100">

    <div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4 col-xxl-3 offset-xxl-auto mr-auto mb-4">

      <ion-card>
      <div class="mx-4">

        <div class="row">
          <div class="col">
            <button class="btn custom-white-btn mt-4" (click)="onGoingBack()">
              <i class="fa-solid fa-circle-arrow-left" style="font-size: 35px;"></i>
            </button>
          </div>
          <div class="col text-end">
            <button id="ac1" class="btn custom-white-btn mt-4">
              <i class="fa-solid fa-ellipsis-vertical" style="font-size: 24px;"></i>
            </button>

            <ion-popover trigger="ac1" [dismissOnSelect]="true" triggerAction="click">
              <ng-template>
                <ion-content>
                  <ion-list lines="none">
                    <ion-item button (click)="downloadPdf()">
                      <ion-label>Descargar PDF</ion-label>
                    </ion-item>
                    <ion-item button (click)="downloadCsv()">
                      <ion-label>Descargar CSV</ion-label>
                    </ion-item>
                  </ion-list>
                </ion-content>
              </ng-template>
            </ion-popover>
          </div>
        </div>

      </div>


        <div class="mx-4 mb-3">

          <div class="row mt-3">
            <div class="col">
              <!-- <div class=" mb-0 title-text-size">{{ title }}</div> -->
              <div class=" mb-0 title-text-size">{{ auditoryTitle }}</div>

              <p class="text text-mini coolor mt-0">{{ auditoryDate }} {{ auditoryTime }}</p>
              <p class="text text-mini coolor mt-0">{{ auditoryDescription }}</p>
            </div>
          </div>

          <cdk-virtual-scroll-viewport #viewport itemSize="300" class="bg-white ">      </cdk-virtual-scroll-viewport>

          <div class="text">
            Ubicación:
            <app-map></app-map>
          </div>

          <div *ngIf="auditoyrEvidences.length > 0" class="text mt-2">
            Fotografías del entorno:
            <img width="100%" *ngFor="let url of auditoyrEvidences" class="mb-2" [src]="url">
          </div>

          <div *ngFor="let section of auditorySections" class="mx-2 mt-4">
            <div class="text-start sub-title-text-size">{{ section.name }}</div>
            <div class="text-start text">{{ section.subname }}</div>

            <div *ngFor="let answer of section.answers"  class="mt-3">
              <div class="text-question">
                {{ answer.uid + '.- ' + answer.sentence}}
              </div>
              <div class="text ms-4">{{ answer.formattedAnswer }}</div>

              <p *ngIf="answer.dir">
                <img width="100%" [src]="answerEvicenceUrl(answer.dir)">
              </p>
            </div>
          </div>

        </div>
      </ion-card>
    </div>

  </div>
</ion-content>
