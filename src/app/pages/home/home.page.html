        <app-profile-header *ngIf="showProfileHeader"></app-profile-header>

        <div class="row mt-5">
          <div class="col">
            <div class=" mb-0 title-text-size">Módulos</div>

            <p class="text text-mini coolor mt-0">Lorem ipsum</p>
          </div>
        </div>
      </div>

      <div class="mx-4">


        <div class="card rounded-4 border-0 card-red mt-3">
          <div class="card-body">

            <div class="row mt-0">
              <div class="col">
                <h5 class="text text-start text-white mb-0 pb-0">Auditorias</h5>

                <p class="text text-mini text-white coolor mt-0">Lorem ipsum</p>
              </div>
            </div>

            <div class="row m-0 p-0 mt-1">
              <div class="col-9 m-0 p-0">
                    <button class="btn custom-red-btn" (click)="onNewAuditory()">
                      + Nuevo auditoría
                    </button>
                  </div>
                  <div class="col-3 text-end m-0 p-0">

                    <button class="btn px-3 custom-red-btn" (click)="onAuditoryList()">
                      <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
              </div>
            </div>

          </div>
        </div>

        <div class="card rounded-4 border-0 card-yellow mt-4">
          <div class="card-body">

            <div class="row mt-0">
              <div class="col">
                <h5 class="text text-start text-white mb-0 pb-0">Uso de Casco</h5>

                <p class="text text-mini text-white coolor mt-0">Lorem ipsum</p>
              </div>
            </div>

            <div class="row m-0 p-0 mt-1">
              <div class="col-9 m-0 p-0">
                    <button class="btn custom-yellow-btn" (click)="onNewHelmet()">
                      + Nuevo uso de casco
                    </button>
                  </div>
                  <div class="col-3 text-end m-0 p-0">

                    <button class="btn px-3 custom-yellow-btn" (click)="onHelmetList()">
                      <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
              </div>
            </div>

          </div>
        </div>
        <div class="card rounded-4 border-0 card-blue mt-4">
          <div class="card-body">

            <div class="row mt-0">
              <div class="col">
                <h5 class="text text-start text-white mb-0 pb-0">Uso de Cinturón</h5>

                <p class="text text-mini text-white coolor mt-0">Lorem ipsum</p>
              </div>
            </div>

            <div class="row m-0 p-0 mt-1">
              <div class="col-9 m-0 p-0">
                    <button class="btn custom-blue-btn" (click)="onNewBelt()">
                      + Nuevo uso de cinturón
                    </button>
                  </div>
                  <div class="col-3 text-end m-0 p-0">

                    <button class="btn px-3 custom-blue-btn" (click)="onBeltList()">
                      <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
              </div>
            </div>

          </div>
        </div>
        <div class="card rounded-4 border-0 card-gray mt-4">
          <div class="card-body">

            <div class="row mt-0">
              <div class="col">
                <h5 class="text text-start text-white mb-0 pb-0">Conteo General</h5>

                <p class="text text-mini text-white coolor mt-0">Lorem ipsum</p>
              </div>
            </div>

            <div class="row m-0 p-0 mt-1">
              <div class="col-9 m-0 p-0">
                    <button class="btn custom-gray-btn" (click)="onNewGeneralCount()">
                      + Nuevo conteo general
                    </button>
                  </div>
                  <div class="col-3 text-end m-0 p-0">

                    <button class="btn px-3 custom-gray-btn" (click)="onGeneralCountList()">
                      <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>

  </div>

</ion-content>
