<ion-content>
  <div class="background m-0 p-0 h-100">

    <div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4 col-xxl-3 offset-xxl-auto mr-auto mb-4">

      <div class="mx-5">
        <button class="btn custom-white-btn mt-4" (click)="onCancel()">
          <i class="fa-solid fa-circle-arrow-left" style="font-size: 35px;"></i>
        </button>

      </div>

      <ion-card>
        <div class="mx-4 mb-3">

        <div class="row mt-3 bg-white ">
          <div class="col">
            <!-- <div class=" mb-0 title-text-size">{{ title }}</div> -->
            <div class=" mb-0 title-text-size">Conteo general</div>

            <p class="text text-mini coolor mt-0">Ubicado en un cruce específico, indique la cantidad de vehículos que pasan por su tipo.</p>
          </div>
        </div>


         <p class="title-text-size text-center mt-3">{{ names[count] }}</p>

         <div class="row  m-0 p-0">
          <div class="col text-center m-0 p-0">
              <button (click)="countChange(-1)" [disabled]="counts[count] === 0" class="btn custom-white-btn">
                  <i class="fa-solid fa-circle-minus" style="font-size: 50px;"></i>
                </button>
          </div>
          <div class="col text-center title-text-size pt-3">
            {{ counts[count] }}
          </div>
          <div class="col text-center  m-0 p-0">
              <button (click)="countChange(1)" class="btn custom-white-btn">
                  <i class="fa-solid fa-circle-plus" style="font-size: 50px;"></i>
                </button>
          </div>
        </div>


         <ul class="list-group p-0 m-0 bg-white text text-mini  "  style="transform: rotate(270deg);  width: auto">
          <li *ngFor="let name of names; let i = index" (click)="onSelectIndex(i)"  class="list-group-item text text-mini border-0 m-0 p-0  my-1" [ngClass]="{'h5': i === count}" >{{ counts[i] }} {{ name }}</li>
        </ul>

        <div class="row bg-white mt-2">
          <div class="col-6 text-center ">

            <button (click)="changeColor(-1)" class="btn custom-white-btn">
                <i class="fa-solid fa-circle-chevron-left" style="font-size: 50px;"></i>
              </button>

          </div>

          <div class="col-6 text-center">
            <button (click)="changeColor(1)" class="btn custom-white-btn">
                <i class="fa-solid fa-circle-chevron-right" style="font-size: 50px;"></i>
              </button>
          </div>
        </div>

        <div class="my-5"></div>

        <ion-row class="mt-5">
          <ion-col>

            <div class="text-center d-grid gap-2">

              <button
                class="btn custom-gray-btn"
                (click)="onSubmit()"
              >Guardar</button>
            </div>

          </ion-col>
        </ion-row>

      </div>
      </ion-card>
    </div>
  </div>
</ion-content>
