<div class="custom-background">

  <div class="col-sm-10 offset-sm-1 col-md-8 offset-md-2 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4 col-xxl-3 offset-xxl-auto mr-auto mb-4">

    <div class="mx-5">

      <div class="row mt-5 mb-0">
        <div class="col text-end">
          <i class="fa-solid fa-circle-user circular-shadow"></i>
        </div>
      </div>

      <div class="row mt-0">
        <div class="col">
          <h3 class="text text-white">Log In</h3>

          <p class="text text-mini coolor">Lorem ipsum dolor sit amet consectetur adipisicing elit. Non molestias.</p>
        </div>
      </div>
    </div>




    <form (ngSubmit)="onLogin(formLogin)" #formLogin="ngForm">

      <div class="container-fluid d-flex flex-column vh-100 m-0 p-0">
        <div class="row m-0 p-0 flex-grow-1">
          <div class="col m-0 p-0">

            <div class="card border-0 rounded-5 p-4">

              <div class=" mx-2 mt-2">

                  <div class="input-with-icon">

                    <input
                                name="email"
                                type="email"
                                #email="ngModel"
                                [(ngModel)]="user.email"
                                placeholder="Email"
                                class="form-control py-3 px-4"
                                required
                                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">

                                <i class="fa-solid fa-envelope"></i>
                  </div>



                    <div class="input-with-icon mt-3">

                      <input
                                  type="password"
                                  name="password"
                                  #password="ngModel"
                                  [(ngModel)]="user.password"
                                  required
                                    placeholder="Password"
                                class="form-control py-3 px-4">

                      <i class="fa-solid fa-lock"></i>

                    </div>
                    <div class="d-flex flex-row-reverse mt-3" (click)="onRecuperar()">
                      <label class="forgot-password-color text text-mini">Forgot password? </label>
                    </div>
              </div>

              <div class="row my-5"></div>
              <div class="row my-5"></div>

              <ion-row class="mt-3">
                <!-- <ion-col>
                  <button class="btn btn-primary custom-btn" (click)="onRegistrar()">REGISTRARME</button>
                </ion-col> -->

                <ion-col>
                  <button class="btn btn-primary custom-btn" type="submit">
                    {{txtButtonEnter}}
                  </button>
                </ion-col>
              </ion-row>

              <ion-row class="mt-2">
                <ion-col class="text-center">
                  <label (click)="onRegistrar()" class="forgot-password-color text text-mini">Don't have an account. <strong><u class="mt-3">SIGN UP</u></strong></label>
                </ion-col>
              </ion-row>

              <div class="row my-5"></div>
              <div class="row my-5"></div>
              <div class="row my-5"></div>


            </div>
          </div>
        </div>

      </div>




    </form>
  </div>
</div>
